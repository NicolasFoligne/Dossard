<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dossard</title>
  <meta name="description" content="Préparation sportive multi-objectifs : course à pied et triathlon.">
  <meta name="theme-color" content="#e8590c" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dossard">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icone.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icone-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="maj" class="bandeau-maj" role="status" hidden>
    <span>Nouvelle version disponible</span>
    <button type="button" class="bouton petit">Mettre à jour</button>
  </div>

  <main id="principal">
    <p class="chargement">Chargement…</p>
  </main>

  <nav class="barre-onglets" aria-label="Navigation principale">
    <a class="onglet" href="#/accueil" data-route="accueil">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Accueil</span>
    </a>
    <a class="onglet" href="#/plan" data-route="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Plan</span>
    </a>
    <a class="onglet" href="#/objectifs" data-route="objectifs">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>
      <span>Objectifs</span>
    </a>
    <a class="onglet" href="#/historique" data-route="historique">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Historique</span>
    </a>
    <a class="onglet" href="#/reglages" data-route="reglages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
      <span>Réglages</span>
    </a>
  </nav>

  <div id="feuilles"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>Dossard nécessite JavaScript.</noscript>
</body>
</html>
